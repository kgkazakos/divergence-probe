[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "divergence-probe"
version = "0.1.0"
description = "Detect habitual-claim vs episodic-report divergence in UX research transcripts — no graph database required"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Kostas Kazakos", email = "kostas@cpr-research.io" }]
keywords = [
    "ux-research",
    "behavioural-divergence",
    "qualitative-analysis",
    "transcript-analysis",
    "computational-product-research",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
anthropic = ["anthropic>=0.25"]
gemini = ["google-genai>=0.8"]
llm = ["openai>=1.0", "anthropic>=0.25", "google-genai>=0.8"]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
dp = "divergence_probe.cli:main"

[project.urls]
Repository = "https://github.com/kgkazakos/divergence-probe"
"CPR Ecosystem" = "https://github.com/kgkazakos"

[tool.setuptools.packages.find]
include = ["divergence_probe*"]

[tool.ruff]
line-length = 95
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
